<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Workflow Canvas</title>
    <script>
      // Apply the saved (or OS) theme before first paint to avoid a flash.
      // Mirrors src/store/useThemeStore.ts (zustand persist format).
      (function () {
        var theme;
        try {
          theme = JSON.parse(localStorage.getItem('wf-theme')).state.theme;
        } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
